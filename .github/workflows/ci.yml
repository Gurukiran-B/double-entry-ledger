name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledger_admin
          POSTGRES_PASSWORD: ledger_admin_test_password
          POSTGRES_DB: ledger_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ledger_admin -d ledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LEDGER_DATABASE_URL: postgresql://ledger_app:ledger_app_test_password@127.0.0.1:5433/ledger_test
      LEDGER_MIGRATION_DATABASE_URL: postgresql://ledger_admin:ledger_admin_test_password@127.0.0.1:5433/ledger_test
      LEDGER_TEST_ADMIN_DATABASE_URL: postgresql://ledger_admin:ledger_admin_test_password@127.0.0.1:5433/ledger_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Mark isolated database and create application role
        run: |
          psql "$LEDGER_MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          COMMENT ON DATABASE ledger_test IS 'ledger-experiment-tests-only';
          CREATE ROLE ledger_app
              LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS
              PASSWORD 'ledger_app_test_password';
          GRANT CONNECT ON DATABASE ledger_test TO ledger_app;
          SQL
      - name: Apply migrations
        run: python -m ledger.migrate
      - name: Run Ruff
        run: ruff check .
      - name: Run Mypy
        run: mypy src tests
      - name: Run pytest
        run: python -m pytest -v
