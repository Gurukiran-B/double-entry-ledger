[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "double-entry-ledger"
version = "0.1.0"
description = "A correctness-focused double-entry ledger service"
requires-python = ">=3.12,<3.13"

dependencies = [
    "psycopg[binary]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
